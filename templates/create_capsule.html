{% extends "base.html" %}
{% block content %}
<h2>Create a New Time Capsule</h2>

<form method="post" class="mt-3">
  <div class="mb-3">
    <label class="form-label">Your Name</label>
    <input type="text" name="sender_name" class="form-control" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Your Email</label>
    <input type="email" name="sender_email" class="form-control" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Recipient Email</label>
    <input type="email" name="recipient_email" class="form-control" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Subject</label>
    <input type="text" name="subject" class="form-control" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Message</label>
    <textarea name="message" class="form-control" rows="5" required></textarea>
  </div>

  <div class="mb-3">
    <label class="form-label">Delivery Date & Time</label>
    <input type="datetime-local" name="delivery_datetime" class="form-control" required>
  </div>

  <button type="submit" class="btn btn-primary">Create Capsule</button>
</form>
{% endblock %}
